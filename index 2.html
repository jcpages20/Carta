:20px;pointer-events:none;opacity:0;transform:translateY(25px) scale(.88);transition:opacity .9s,transform 1.15s cubic-bezier(.2,.85,.22,1)}.paper-wrap.show{opacity:1;transform:none;pointer-events:auto}.paper{position:relative;max-width:600px;width:min(90vw,600px);min-height:370px;max-height:83dvh;overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(25px,5vw,65px) clamp(27px,6vw,65px) 35px;background:linear-gradient(125deg,#fff1ca,#ffe0af 65%,#f5cd99);border:2px solid #b77b50;box-shadow:0 18px 55px #1c1015a9, inset 0 0 35px #a97b443b;border-radius:3px;text-align:center;transform:rotate(-1deg)}.paper:before{content:'';position:absolute;inset:13px;border:1px solid #c58b65;pointer-events:none}.floral{position:absolute;color:#ca8d83;font-size:31px;opacity:.75}.floral.a{top:16px;left:24px}.floral.b{right:25px;bottom:25px}.address{font-style:italic;font-size:clamp(25px,5vw,36px);margin:0 0 26px;align-self:flex-start}.message{font-size:clamp(18px,3.5vw,25px);line-height:1.7;margin:0 0 24px}.continue{z-index:1;margin-top:8px;border:1px solid #a87362;border-radius:100px;padding:12px 26px;background:#f4d3b8;color:#5a332e;font-size:15px;cursor:pointer}.continue:active{transform:scale(.98)}#stars{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity 2.5s;pointer-events:none}#stage.night #stars{opacity:1}.end{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:max(45px,env(safe-area-inset-bottom) + 26px);gap:13px;pointer-events:none;opacity:0;transition:opacity 2s;color:#fff6f0;text-shadow:0 2px 14px #17112e;text-align:center}.end.show{opacity:1;pointer-events:auto}.end p{margin:0;font-size:clamp(20px,4.7vw,30px);letter-spacing:.035em}.again{background:#ffffff24;border:1px solid #ffffff85;color:white;border-radius:40px;padding:9px 20px;backdrop-filter:blur(5px);cursor:pointer;font-size:14px}.shooting{position:absolute;top:30%;left:75%;width:8px;height:8px;border-radius:50%;z-index:3;opacity:0;background:#fff;box-shadow:0 0 13px 4px #ffecc4,0 0 30px 8px #f3c7ff;pointer-events:none}.shooting:after{content:'';position:absolute;right:4px;top:3px;width:170px;height:2px;background:linear-gradient(90deg,transparent,#d9d5ff,#fff);transform-origin:right center;transform:rotate(-24deg)}.shooting.go{animation:shoot 2.3s ease-in forwards}@keyframes shoot{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}73%{opacity:1}100%{opacity:0;transform:translate(-72vw,28vh)}}@media(max-width:650px){.scene{background-size:auto 100%;}.paper{min-height:340px}.hit{left:14%;top:31%;width:73%;height:34%}.hint{bottom:11%}}@media(prefers-reduced-motion:reduce){.scene,.paper-wrap,.end{transition-duration:.15s}.hint{animation:none}.shooting.go{animation-duration:3.3s}}

</head>
<body>
<main id="stage" aria-label="Una carta para Gabi">
 <div class="scene desk"></div><div class="scene sky"></div><canvas id="stars" aria-hidden="true"></canvas><div class="shade"></div>
 <button class="hit" id="envelope" aria-label="Abrir la carta para Gabi"></button><div class="hint" id="hint">Toca la carta para abrirla ✨</div>
 <div class="paper-wrap" id="paperWrap"><article class="paper" role="dialog" aria-label="Carta para Gabi"><span class="floral a" aria-hidden="true">❀</span><span class="floral b" aria-hidden="true">✿</span><p class="address">Gabi,</p><p class="message">A veces el mundo real parece muy difícil, pero podemos jugar a estar juntos por aquí. Este mundo lo creé pensando en eso.<br><br>No es Sims, pero espero te guste.</p><button class="continue" id="continue">Cerrar carta ✧</button></article></div>
 <div class="shooting" id="shooting"></div><div class="end" id="end"><p>Un mundo para compartir ✨</p><button class="again" id="again">Volver a ver</button></div>
</main>
<script>
(()=>{
const stage=document.querySelector('#stage'),envelope=document.querySelector('#envelope'),hint=document.querySelector('#hint'),paper=document.querySelector('#paperWrap'),next=document.querySelector('#continue'),end=document.querySelector('#end'),shoot=document.querySelector('#shooting'),again=document.querySelector('#again'),canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d');let state='closed',timers=[],stars=[];const later=(f,t)=>timers.push(setTimeout(f,t));function clear(){timers.forEach(clearTimeout);timers=[]}
function resize(){let dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(120,Math.floor(w*h/5500))},()=>({x:Math.random()*w,y:Math.random()*h*.87,r:Math.random()*1.35+.15,phase:Math.random()*6.3,speed:Math.random()*.0017+.0004}));}function twinkle(t){let w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);for(let s of stars){let a=.18+.5*(.5+.5*Math.sin(t*s.speed+s.phase));ctx.fillStyle=`rgba(255,244,232,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}requestAnimationFrame(twinkle)}resize();addEventListener('resize',resize);requestAnimationFrame(twinkle);
envelope.addEventListener('click',()=>{if(state!=='closed')return;state='opening';envelope.disabled=true;hint.classList.add('hidden');later(()=>{paper.classList.add('show');state='reading';next.focus({preventScroll:true})},520)});
next.addEventListener('click',()=>{if(state!=='reading')return;state='closing';paper.classList.remove('show');later(()=>{stage.classList.add('night');state='night'},950);later(()=>{shoot.classList.add('go')},4000);later(()=>{end.classList.add('show');state='ended'},7200)});
again.addEventListener('click',()=>{clear();state='closed';end.classList.remove('show');shoot.classList.remove('go');stage.classList.remove('night');paper.classList.remove('show');hint.classList.remove('hidden');envelope.disabled=false});
})();
</script>
</body>
